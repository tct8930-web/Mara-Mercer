<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Mara Mercer</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    header {
        background: #111;
        color: white;
        text-align: center;
        padding: 50px 20px;
    }

    header h1 {
        font-size: 38px;
        margin: 0 0 10px;
    }

    nav {
        background: white;
        text-align: center;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    nav a {
        color: #111;
        text-decoration: none;
        margin: 0 12px;
        font-weight: bold;
    }

    section {
        max-width: 700px;
        margin: 40px auto;
        padding: 40px 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    h2 {
        text-align: center;
        margin-bottom: 10px;
    }

    .intro {
        text-align: center;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    .order-button {
        width: 100%;
        background: #111;
        color: white;
        border: none;
        padding: 15px;
        margin-top: 25px;
        border-radius: 6px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .order-button:hover {
        background: #333;
    }

    .whatsapp {
        display: block;
        text-align: center;
        background: #111;
        color: white;
        padding: 13px;
        text-decoration: none;
        border-radius: 6px;
        margin-top: 15px;
    }

    footer {
        background: #111;
        color: white;
        text-align: center;
        padding: 20px;
        margin-top: 40px;
    }

    @media (max-width: 700px) {
        nav a {
            display: inline-block;
            margin: 6px;
        }

        section {
            margin: 25px 15px;
            padding: 30px 20px;
        }
    }
</style>

</head>

<body>

<header>
    <h1>Mara Mercer</h1>
    <p>Place Your Order</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="shop.html">Products</a>
    <a href="contact.html">Order</a>
</nav>

<section>

    <h2>Buy Now</h2>

    <p class="intro">
        Fill in your details below to place an order.
        We will contact you to confirm your order and delivery.
    </p>

    <form action="https://formsubmit.co/idris08675@gmail.com" method="POST">

        <input type="hidden" name="_subject" value="New Mara Mercer Order">

        <label for="name">Customer Name</label>
        <input type="text" id="name" name="Customer Name" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="Email" placeholder="Enter your email address" required>

        <label for="product">Select Product</label>
        <select id="product" name="Product" required>
            <option value="">Choose a product</option>
            <option value="Product 1 - $60.50">Product 1 - $60.50</option>
            <option value="Product 2 - $40.60">Product 2 - $40.60</option>
            <option value="Product 3 - $55.20">Product 3 - $55.20</option>
            <option value="Product 4 - $57.40">Product 4 - $57.40</option>
            <option value="Product 5 - $60.00">Product 5 - $60.00</option>
            <option value="Product 6 - $45.80">Product 6 - $45.80</option>
            <option value="Product 7 - $55.80">Product 7 - $55.80</option>
            <option value="Product 8 - $55.80">Product 8 - $55.80</option>
            <option value="Product 9 - $48.10">Product 9 - $48.10</option>
            <option value="Product 10 - $60.50">Product 10 - $60.50</option>
        </select>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="Quantity" min="1" value="1" required>

        <label for="address">Delivery Address</label>
        <textarea id="address" name="Delivery Address" placeholder="Enter your full delivery address" required></textarea>

        <label for="details">Order Details</label>
        <textarea id="details" name="Order Details" placeholder="Add any additional information about your order"></textarea>

        <button type="submit" class="order-button">
            Place Order
        </button>

    </form>

    <a href="https://wa.me/" class="whatsapp">
        Order Through WhatsApp
    </a>

</section>

<footer>
    <p>©️ 2026 Mara Mercer. All rights reserved.</p>
</footer>

</body>

</html>
